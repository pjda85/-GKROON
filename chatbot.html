<!-- AI Chatbot Widget -->
<div id="chatbot-widget" class="chatbot-widget">
  <button id="chatbot-toggle" class="chatbot-toggle" aria-label="Toggle chatbot">
    <i class="fas fa-comments"></i>
    <span class="chatbot-badge" id="chatbot-badge">1</span>
  </button>

  <div id="chatbot-window" class="chatbot-window hidden">
    <div class="chatbot-header">
      <div class="chatbot-header-info">
        <div class="chatbot-avatar">
          <i class="fas fa-robot"></i>
        </div>
        <div>
          <h3>GKroon Assistant</h3>
          <p class="chatbot-status">
            <span class="status-dot"></span> Online
          </p>
        </div>
      </div>
      <button id="chatbot-minimize" class="chatbot-minimize">
        <i class="fas fa-minus"></i>
      </button>
    </div>

    <div class="chatbot-messages" id="chatbot-messages">
      <div class="chatbot-message bot-message">
        <div class="message-avatar">
          <i class="fas fa-robot"></i>
        </div>
        <div class="message-content">
          <p>Hello! I'm your GKroon AI Assistant. How can I help you today?</p>
          <div class="message-time"></div>
        </div>
      </div>

      <div class="quick-replies">
        <button class="quick-reply-btn" data-query="What services do you offer?">
          <i class="fas fa-briefcase"></i> Your Services
        </button>
        <button class="quick-reply-btn" data-query="How do I register a company?">
          <i class="fas fa-building"></i> Company Registration
        </button>
        <button class="quick-reply-btn" data-query="Tell me about web design">
          <i class="fas fa-laptop-code"></i> Web Design
        </button>
        <button class="quick-reply-btn" data-query="What are your hosting packages?">
          <i class="fas fa-server"></i> Hosting Packages
        </button>
      </div>
    </div>

    <div class="chatbot-typing hidden" id="chatbot-typing">
      <div class="typing-indicator">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <span>Assistant is typing...</span>
    </div>

    <div class="chatbot-input">
      <textarea
        id="chatbot-input-field"
        placeholder="Type your message..."
        rows="1"
        maxlength="500"
      ></textarea>
      <button id="chatbot-send" class="chatbot-send-btn" disabled>
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>

    <div class="chatbot-footer">
      <small>Powered by AI • <a href="#" target="_blank">Privacy Policy</a></small>
    </div>
  </div>
</div>
